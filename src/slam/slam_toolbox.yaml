slam_toolbox:
  ros__parameters:
    use_sim_time: false

    # === Frames de ton robot ===
    odom_frame: odom        # publié par wheel_odom
    map_frame: map          # publié par slam_toolbox
    base_frame: base_link   # frame du châssis

    # === Lidar ===
    scan_topic: /scan       # ton sllidar publie bien sur /scan

    # On utilise ton odométrie roues
    use_odometry: true
    provide_odom_frame: false   # on NE veut PAS que slam_toolbox invente son propre /odom

    # Un peu de paramètres "safe"
    resolution: 0.05
    max_laser_range: 12.0
    transform_publish_period: 0.05   # map->odom à 20 Hz
    scan_queue_size: 1               # recommandé en mode async
    mode: "mapping"
